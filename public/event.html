<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.1/css/lg-zoom.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
    
    <!-- Navigation Script -->
    <script src="js/navigation.js" defer></script>
    
    <style>
      /* Page-specific styles for event gallery */
      
      /* Background decorations */
      .page-bg-decoration {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .bg-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.3;
        animation: blobFloat 25s ease-in-out infinite;
      }

      .blob-1 {
        width: 400px;
        height: 400px;
        background: linear-gradient(135deg, #f7b733, #fc4a1a);
        top: -150px;
        right: -100px;
      }

      .blob-2 {
        width: 350px;
        height: 350px;
        background: linear-gradient(135deg, #805ad5, #ed64a6);
        bottom: -100px;
        left: -80px;
        animation-delay: -10s;
      }

      @keyframes blobFloat {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.05); }
      }

      /* Disable LightGallery clicks in selection mode */
      .gallery.selection-mode .gallery-item {
        cursor: pointer !important;
      }
      
      .gallery.selection-mode .gallery-item:hover .gallery-item-overlay {
        opacity: 0 !important;
      }
      
      .selection-mode .selection-checkbox {
        z-index: 1000 !important;
        pointer-events: auto !important;
      }
      
      .selection-mode .gallery-item {
        position: relative;
      }
      
      .selection-mode .gallery-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 999;
        background: transparent;
        pointer-events: none;
      }
      
      /* Folder styling */
      .gallery-item.folder-item {
        cursor: pointer;
        display: flex;
        flex-direction: column;
        background: linear-gradient(135deg, #1a1225 0%, #2d2438 100%);
      }
      
      .gallery-item.folder-item:hover {
        transform: translateY(-8px) rotate(-1deg);
        box-shadow: 0 20px 60px rgba(26, 18, 37, 0.2), 0 0 40px rgba(247, 183, 51, 0.1);
      }
      
      .folder-cover {
        width: 100%;
        height: 100%;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        flex: 1;
      }
      
      .folder-placeholder {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #805ad5 0%, #fc4a1a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 3rem;
      }
      
      .folder-overlay {
        background: linear-gradient(0deg, rgba(26,18,37,0.8) 0%, transparent 100%);
      }
      
      .folder-name {
        font-weight: 600;
        margin-left: 8px;
        font-size: 0.95rem;
      }
      
      /* Folder name bar */
      .folder-name-bar {
        background: rgba(255, 255, 255, 0.95);
        padding: 10px 14px;
        margin-top: 10px;
        border-radius: 12px;
        text-align: center;
        font-weight: 600;
        font-size: 0.9rem;
        color: #1a1225;
        box-shadow: 0 2px 12px rgba(26, 18, 37, 0.08);
        backdrop-filter: blur(10px);
      }
      
      /* Gallery item enhancements */
      .gallery-item {
        position: relative;
        aspect-ratio: 1;
        border-radius: 16px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        background: #fff;
        box-shadow: 0 2px 8px rgba(26, 18, 37, 0.06);
      }

      .gallery-item::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 16px;
        border: 2px solid transparent;
        transition: border-color 0.3s ease;
        pointer-events: none;
      }

      .gallery-item:hover::after {
        border-color: #f7b733;
      }

      .gallery-item:hover {
        transform: translateY(-8px) rotate(-1deg);
        box-shadow: 0 20px 50px rgba(26, 18, 37, 0.15);
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
      }

      .gallery-item:hover img {
        transform: scale(1.1);
      }

      /* Photo frame decoration on hover */
      .gallery-item::before {
        content: '';
        position: absolute;
        top: 8px;
        left: 8px;
        right: 8px;
        bottom: 8px;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 12px;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 1;
      }

      .gallery-item:hover::before {
        opacity: 1;
      }

      /* Gallery grid */
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 24px;
        margin-top: 32px;
      }

      /* Mobile specific styles */
      @media (max-width: 768px) {
        .folder-name-bar {
          font-size: 0.85rem;
          padding: 8px 12px;
        }
        
        .gallery-item.folder-item {
          margin-bottom: 8px;
        }

        .gallery-grid {
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 16px;
        }

        .gallery-item {
          border-radius: 12px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Background decorations -->
    <div class="page-bg-decoration">
      <div class="bg-blob blob-1"></div>
      <div class="bg-blob blob-2"></div>
    </div>

    <!-- Header -->
    <header class="header">
      <div class="container">
        <nav class="nav">
          <div class="nav-left">
            <button class="back-button" title="Go back">
              <i class="fas fa-chevron-left"></i>
            </button>
            <a href="/" class="logo-link">
              <img src="/img/falconswhite.png" alt="Falcons Logo" class="logo">
              <span class="logo-text">Falcons</span>
            </a>
          </div>
          
          <div class="nav-center">
            <span class="fest-pill">✦ Cultural Fest 2026</span>
          </div>
          
          <div class="nav-right">
            <a href="index1.html" class="nav-link">
              <span>All Events</span>
              <i class="fas fa-th-large"></i>
            </a>
            <a href="/aboutus.html" class="nav-link">
              <span>Team</span>
              <i class="fas fa-users"></i>
            </a>
          </div>
        </nav>
      </div>
    </header>

    <!-- Event Header -->
    <section class="event-header">
      <div class="container">
        <div class="event-header-content">
          <div class="header-left">
            <h1 id="event-name" class="event-title">Loading...</h1>
            <p class="event-subtitle">Cultural Fest 2026</p>
          </div>
          
          <div class="gallery-controls">
            <button id="refreshBtn" class="control-btn">
              <i class="fas fa-sync-alt"></i>
              <span>Refresh</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Gallery Content -->
    <main class="photo-gallery">
      <div class="container">
        <!-- Loading State -->
        <div id="loading" class="loading-container">
          <div class="loading-spinner"></div>
          <p class="loading-text">Loading your memories...</p>
        </div>

        <!-- Gallery Grid -->
        <div id="gallery" class="gallery-grid" style="display: none;">
          <!-- Dynamic gallery content will be inserted here -->
        </div>

        <!-- Pagination Section -->
        <div id="paginationSection" class="pagination-section" style="display: none;">
          <!-- Pagination controls will be inserted here -->
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-left">
            <img src="/img/falconswhite.png" alt="Falcons Logo" class="footer-logo">
            <div class="footer-text">
              <p class="footer-brand">Falcons of BMSCE</p>
              <p class="footer-copyright">© 2026 All rights reserved</p>
            </div>
          </div>
          
          <div class="footer-center">
            <p class="made-with">Made with <span class="heart">♥</span> for the fest</p>
          </div>
          
          <div class="footer-right">
            <div class="social-links">
              <a href="https://www.instagram.com/falcons.of.bmsce/" class="social-link" aria-label="Instagram" target="_blank">
                <i class="fab fa-instagram"></i>
              </a>
              <a href="https://www.linkedin.com/company/falcons-of-bmsce/" class="social-link" aria-label="LinkedIn" target="_blank">
                <i class="fab fa-linkedin-in"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <!-- LightGallery JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.1/lightgallery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.1/plugins/zoom/lg-zoom.min.js"></script>

    <!-- Custom JS -->
    <script src="/js/event.js"></script>
  </body>
</html>
